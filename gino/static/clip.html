<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Gino's video camera. Only opened by the server's own headless browser (gino/clips.py) to film a short
     vertical clip of his 3D world. It has no data of its own: the server hands it a filtered script.
     Time is "fake" here: the server asks for one frame at a time, so every clip plays smoothly however slow
     the server's computer is. -->
<title>Gino's video camera</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5}
  #world{position:fixed;left:0;top:0}#tip{display:none}
  @font-face{font-family:Fraunces;src:url(/static/welcome/fonts/fraunces.woff2) format('woff2');font-weight:100 900}
  @font-face{font-family:Caveat;src:url(/static/welcome/fonts/caveat.woff2) format('woff2');font-weight:400 700}
</style>
<script>
  // a pretend clock: the page only moves forward when the server asks for the next frame
  (() => {
    let now = 0, queue = [];
    performance.now = () => now;
    window.requestAnimationFrame = cb => { queue.push(cb); return queue.length; };
    window.cancelAnimationFrame = () => {};
    window.__advance = ms => { now += ms; const q = queue; queue = []; for (const cb of q) cb(now); };
  })();
</script>
</head><body>
<div id="world"></div><div id="tip"></div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }
</script>
<script type="module">
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fade = (t, a, b, edge = 0.45) => clamp01(Math.min((t - a) / edge, (b - t) / edge));   // 0..1 in, hold, out

let W, H, px = 1, job, w, THREE, out, g, shots = [], total = 0, frame = 0, curShot = -1, hourNow = 12, curSt = null;
// "watch my home grow" clips: how many of his things have appeared so far (in the order he built them)
let grown = Infinity;
const visible = () => job.grow ? job.state.habitat.filter(it => (job.grow.order[String(it.id)] ?? 0) < grown) : job.state.habitat;
const art = {};

function loadImage(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

window.setupClip = async (j) => {
  job = j; W = j.width; H = j.height; px = W / 720;   // shadows and gaps were tuned on a 720-wide video
  THREE = await import('three');
  // the 3D world is drawn a little smaller and stretched to fit (much quicker on a server without a graphics card);
  // the words are drawn at full size on top, so they stay sharp
  const box = document.getElementById('world'), rs = j.render_scale || 1;
  box.style.width = Math.round(W * rs) + 'px'; box.style.height = Math.round(H * rs) + 'px';
  await Promise.all([document.fonts.load('700 40px Fraunces'), document.fonts.load('700 40px Caveat')]).catch(() => {});
  for (const s of j.shots) if (s.art && !art[s.art]) art[s.art] = await loadImage(s.art);
  const { createWorld } = await import('/static/world.js?v=2');
  w = createWorld(box, document.getElementById('tip'), {
    key: '', season: j.state.weather?.season, look: j.state.weather?.look, autoQuality: false, lite: true, film: j.film || null,
    clock: () => hourNow, director: direct });
  // 'high': all his fur, all the grass and sharper shadows; smooth edges and colour come from the film effects
  w.setQuality(j.detail === 'high' ? 'high' : 'low');
  await w._debug.gino.userData.realReady;   // film the sculpted Gino, not the backup shapes
  if (j.detail === 'fur') w._debug.gino.traverse(n => { if (n.userData.shell) n.visible = true; });   // all his fur, the rest light
  // a new thing he made starts beside where it will go: in the clip he carries it to its spot
  if (j.carry) j.state = { ...j.state, habitat: j.state.habitat.map(it => it.id === j.carry.id ? { ...it, x: j.carry.from[0], y: j.carry.from[1] } : it) };
  w.update(j.state);
  const { controls, roam, skip, snap, place, cellPos } = w._debug;
  controls.enableDamping = false; controls.autoRotate = false; controls.enabled = false;
  controls.minDistance = 0.5;   // close-ups of his face
  roam.on = true;            // let him move about like on /live
  skip(); snap();
  if (j.start) {   // where he stands when the clip begins, already facing where he's about to go
    const a = cellPos(j.start.at[0], j.start.at[1]), b = j.start.facing ? cellPos(j.start.facing[0], j.start.facing[1]) : null;
    place(a.x, a.z, b ? Math.atan2(-(b.z - a.z), b.x - a.x) : undefined);
  }
  let t = 0; shots = j.shots.map(s => { const o = { ...s, t0: t, t1: t + s.dur }; t += s.dur; return o; });
  total = t;
  out = document.createElement('canvas'); out.width = W; out.height = H; g = out.getContext('2d');
  g.imageSmoothingQuality = 'high';   // the 3D picture is stretched to fit: stretch it smoothly
  curShot = 0; startShot(shots[0]); hourNow = shots[0].hour[0];
  for (let i = 0; i < 2 * j.fps; i++) window.__advance(1000 / j.fps);   // let the sky, lights and Gino settle first
  return Math.round(total * j.fps);
};

function shotAt(t) { return shots.find(s => t < s.t1) || shots[shots.length - 1]; }

// where the camera is, for this moment of this shot
//   around: 'gino' (his middle), 'face' (his face, for close-ups), 'home' (the middle of his meadow) or [x, y] grid
//   from/to: [distance, height, angle] at the start and end of the shot; angle 0 is straight in front of his face,
//   PI is behind him. track: keep the angle to his face as he turns (follow him, or stay in front of his face).
const faceV = () => w._debug.face(new THREE.Vector3());
function direct() {
  const t = frame / job.fps, s = shotAt(t), k = ease(clamp01((t - s.t0) / s.dur));
  const { camera, controls, gino, cellPos } = w._debug;
  const c = s.cam || {}, onHim = c.around === 'gino' || c.around === 'face';
  let centre;
  if (c.around === 'face') centre = faceV();
  else if (c.around === 'gino') centre = new THREE.Vector3(gino.position.x, gino.position.y + 0.7, gino.position.z);
  else if (Array.isArray(c.around)) centre = cellPos(c.around[0], c.around[1]).add(new THREE.Vector3(0, 0.8, 0));
  else centre = new THREE.Vector3(0, 0.6, 0);
  const a = c.from || [24, 12, -0.6], b = c.to || a;
  const dist = lerp(a[0], b[0], k), high = lerp(a[1], b[1], k), ang = lerp(a[2], b[2], k);
  // which way he faces: fixed for the shot (so the camera doesn't swing with every step), or followed gently
  if (s.__face === undefined) s.__face = onHim ? gino.rotation.y : 0;
  else if (c.track && onHim) { let d = gino.rotation.y - s.__face; d = Math.atan2(Math.sin(d), Math.cos(d)); s.__face += d * 0.08; }
  const yaw = s.__face + ang;
  const want = new THREE.Vector3(centre.x + Math.cos(yaw) * dist, centre.y + high, centre.z - Math.sin(yaw) * dist);
  // follow Gino smoothly rather than jerking with every step (close-ups follow more tightly)
  const f = c.around === 'face' ? 0.35 : 0.18;
  if (s.__seen) { camera.position.lerp(want, f); controls.target.lerp(centre, f); }
  else { camera.position.copy(want); controls.target.copy(centre); s.__seen = true; }
  if (onHim) clearView(camera.position, controls.target);
  else for (const o of w._debug.items.children) o.visible = true;
}

// in close-ups nothing may stand between the camera and Gino: things in the way step out of the picture
const FLAT = new Set(['pond', 'path', 'bridge', 'garden']);
let seg, rel, box, sph;
function clearView(from, to) {
  if (!seg) { seg = new THREE.Vector3(); rel = new THREE.Vector3(); box = new THREE.Box3(); sph = new THREE.Sphere(); }
  seg.subVectors(to, from); const len2 = seg.lengthSq() || 1;
  for (const o of w._debug.items.children) {
    if (o.userData.carried || FLAT.has(o.userData.kind)) { o.visible = true; continue; }
    if (o.userData.r === undefined) { box.setFromObject(o).getBoundingSphere(sph); o.userData.r = Math.min(2.5, sph.radius); o.userData.mid = sph.center.y - o.position.y; }
    rel.copy(o.position); rel.y += o.userData.mid;
    const k = clamp01(rel.clone().sub(from).dot(seg) / len2);
    const d = rel.distanceTo(seg.clone().multiplyScalar(k).add(from));
    o.visible = !(k < 0.92 && d < o.userData.r * 0.85 + 0.25);
  }
}

function startShot(s) {
  hourNow = s.hour[0];
  const st = { ...job.state, asleep: !!s.asleep, activity: s.activity || job.state.activity, emotion: s.emotion || job.state.emotion };
  if (s.carry && job.carry) {   // put the new thing's real spot back: he picks it up and carries it there
    job.state = { ...job.state, habitat: job.state.habitat.map(it => it.id === job.carry.id ? { ...it, x: job.carry.to[0], y: job.carry.to[1] } : it) };
    st.habitat = job.state.habitat;
  }
  if (job.grow) { grown = s.grown === 0 ? 0 : s.grow ? (Number.isFinite(grown) ? grown : 0) : Infinity; st.habitat = visible(); }
  curSt = st;
  w.update(st);
  w.setWeather(s.weather || null);
  const { walkTo, pose, itemPos, gino, place } = w._debug;
  let faceIt = null;
  if (s.near) {   // a quick cut: he's already beside one of his things (or in his pond), facing it
    const p = itemPos(s.near.id);
    if (p) {
      const d = s.near.dist || 0, x = p.x + Math.cos(s.near.side || 0) * d, z = p.z - Math.sin(s.near.side || 0) * d;
      place(x, z, d ? Math.atan2(-(p.z - z), p.x - x) : undefined);
      if (d) faceIt = p;
    }
  }
  if (s.go) {   // walk over to one of his things and stand facing it
    const p = itemPos(s.go.id);
    if (p) {
      const d = new THREE.Vector3(gino.position.x - p.x, 0, gino.position.z - p.z);
      if (d.lengthSq() < 1e-4) d.set(1, 0, 0);
      const stand = d.setLength(s.go.near || 1.9).add(p);
      walkTo(stand.x, stand.z, s.go.act || 'look', p);
    }
  } else if (s.cute && w._debug.cutePose) w._debug.cutePose(s.cute);   // he turns to the camera and strikes a cute pose
  else if (s.pose && !s.carry) pose(s.pose, faceIt);
  if (s.pet) w.pet();   // a happy hop and a few hearts
}

function wrap(text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let line = '';
  for (const wd of words) { const tryL = line ? line + ' ' + wd : wd; if (g.measureText(tryL).width > maxW && line) { lines.push(line); line = wd; } else line = tryL; }
  if (line) lines.push(line);
  return lines;
}

function roundRect(x, y, ww, hh, r) { g.beginPath(); g.roundRect(x, y, ww, hh, r); }

function caption(text, a, y, style) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const big = style === 'title', size = big ? Math.round(W * 0.075) : Math.round(W * 0.066);
  g.font = big ? `700 ${size}px Fraunces, Georgia, serif` : `700 ${size}px Caveat, 'Comic Sans MS', cursive`;
  const lines = wrap(text, W * 0.78), lh = size * (big ? 1.15 : 1.1), pad = size * 0.55;
  const bw = Math.max(...lines.map(l => g.measureText(l).width)) + pad * 2, bh = lines.length * lh + pad * 1.3;
  const x = (W - bw) / 2, top = y - bh / 2 + (1 - a) * 18 * px;
  g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 18 * px; g.shadowOffsetY = 6 * px;
  g.fillStyle = big ? 'rgba(255,248,232,.94)' : 'rgba(255,255,255,.9)';
  roundRect(x, top, bw, bh, size * 0.6); g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = big ? '#4a3420' : '#3b2a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, W / 2, top + pad * 0.65 + lh * (i + 0.5)));
  g.restore();
}

// a speech bubble beside his face, with a little tail pointing at him, as if he's saying it
function speech(text, a) {
  if (a <= 0) return;
  const { camera } = w._debug;
  const p = faceV().project(camera), top = faceV().add(new THREE.Vector3(0, 0.55, 0)).project(camera);
  if (p.z > 1) return;   // he's behind the camera
  const fx = (p.x + 1) / 2 * W, fy = (1 - p.y) / 2 * H, headR = Math.max(20 * px, Math.abs((1 - top.y) / 2 * H - fy));
  g.save(); g.globalAlpha = a;
  const size = Math.round(W * 0.064);
  g.font = `700 ${size}px Caveat, 'Comic Sans MS', cursive`;
  const lines = wrap(text, W * 0.62), lh = size * 1.08, pad = size * 0.5;
  const bw = Math.max(...lines.map(l => g.measureText(l).width)) + pad * 2, bh = lines.length * lh + pad * 1.2;
  const gap = Math.min(H * 0.16, headR * 1.15 + size * 0.6);
  let by = fy - gap - bh, below = false;
  if (by < H * 0.25) { by = Math.min(H * 0.8 - bh, fy + gap); below = true; }   // no room above: say it from below
  by += (1 - a) * 14 * px;
  const bx = Math.max(W * 0.05, Math.min(W * 0.95 - bw, fx - bw * 0.35));
  const tipX = Math.max(bx + size, Math.min(bx + bw - size, fx)), tipY = below ? fy + headR * 0.45 : fy - headR * 0.45;
  const baseY = below ? by : by + bh;
  g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 18 * px; g.shadowOffsetY = 6 * px;
  g.fillStyle = 'rgba(255,255,255,.95)';
  roundRect(bx, by, bw, bh, size * 0.7); g.fill();
  g.beginPath(); g.moveTo(tipX - size * 0.45, baseY); g.lineTo(lerp(tipX, fx, 0.5), lerp(baseY, tipY, 0.55)); g.lineTo(tipX + size * 0.2, baseY); g.closePath(); g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = '#3b2a1a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, bx + bw / 2, by + pad * 0.6 + lh * (i + 0.5)));
  g.restore();
}

function drawArt(s, t) {
  const im = art[s.art]; if (!im) return;
  const a = fade(t, s.t0 + 0.3, s.t1 - 0.1, 0.8), k = clamp01((t - s.t0) / s.dur);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  g.fillStyle = 'rgba(20,14,40,.55)'; g.fillRect(0, 0, W, H);
  const side = W * 0.72 * (1 + k * 0.05), ratio = (im.naturalHeight || 1) / (im.naturalWidth || 1);
  const iw = side, ih = side * ratio, x = (W - iw) / 2, y = H * 0.44 - ih / 2;
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40 * px; g.shadowOffsetY = 12 * px;
  g.fillStyle = '#fffaf0'; roundRect(x - 18 * px, y - 18 * px, iw + 36 * px, ih + 36 * px, 14 * px); g.fill();
  g.shadowColor = 'transparent';
  g.drawImage(im, x, y, iw, ih);
  g.restore();
}

function overlays(t) {
  const s = shotAt(t);
  if (s.tint) {   // dreamy colours for night and dream shots
    const a = fade(t, s.t0, s.t1, 0.8) * s.tint;
    const grd = g.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, H * 0.75);
    grd.addColorStop(0, 'rgba(120,80,200,0)'); grd.addColorStop(1, `rgba(70,40,150,${0.55 * a})`);
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
  }
  if (s.art) drawArt(s, t);
  for (const c of s.captions || []) {
    const a0 = s.t0 + (c.at || 0), a1 = c.until ? s.t0 + c.until : s.t1;
    if (c.style === 'speech') { speech(c.text, fade(t, a0, a1, 0.3)); continue; }
    caption(c.text, fade(t, a0, a1), c.y === 'top' ? H * 0.17 : c.y === 'middle' ? H * 0.5 : H * 0.7, c.style);
  }
  if (s.grow && job.grow && grown > 0) {   // the day of his life each new thing was built
    const label = job.grow.labels[Math.min(grown, job.grow.labels.length) - 1];
    if (label) caption(label, fade(t, s.t0 + 0.2, s.t1 - 0.2, 0.3), H * 0.17, 'title');
  }
  if (job.title) caption(job.title, fade(t, 0.2, 3.4), H * 0.17, 'title');   // below TikTok's own buttons at the top
  // the last moment: who he is and where to find him, near the top, so his face stays in view as the camera
  // closes in on it (and the clip loops back to the close-up it opened with)
  const endA = clamp01((t - (total - job.end_seconds)) / 0.6);
  if (endA > 0) {
    g.save(); g.globalAlpha = endA;
    const grd = g.createLinearGradient(0, 0, 0, H * 0.42);
    grd.addColorStop(0, 'rgba(32,22,12,.55)'); grd.addColorStop(1, 'rgba(32,22,12,0)');
    g.fillStyle = grd; g.fillRect(0, 0, W, H * 0.42); g.restore();
    caption(job.end[0], endA, H * 0.16, 'title');
    if (job.end[1]) caption(job.end[1], endA, H * 0.255);
  }
}

// the server calls this once per frame and gets a JPEG back
window.clipFrame = () => {
  const t = frame / job.fps, i = shots.indexOf(shotAt(t));
  if (i !== curShot) { curShot = i; startShot(shots[i]); }
  const s = shots[i], k = clamp01((t - s.t0) / s.dur);
  if (s.grow && job.grow) {   // his things pop up one by one over most of the shot
    const n = Math.floor(clamp01((t - s.t0 - 0.4) / (s.dur * 0.75)) * job.state.habitat.length + 0.0001);
    if (n !== grown) { grown = n; w.update({ ...curSt, habitat: visible() }); }
  }
  hourNow = lerp(s.hour[0], s.hour[1] ?? s.hour[0], k) % 24;
  window.__advance(1000 / job.fps * (s.speed || 1));
  g.drawImage(document.querySelector('#world canvas'), 0, 0, W, H);   // the 3D frame just drawn
  overlays(t);
  frame++;
  return out.toDataURL('image/jpeg', job.quality || 0.86);
};
window.clipReady = true;
</script>
</body></html>
