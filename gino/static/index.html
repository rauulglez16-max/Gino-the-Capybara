<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gino's Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#3b2f24; --muted:#8a7a68; --line:#e8dfcf;
  --accent:#b8743a; --accent-soft:#f3e3d1; --grass:#bfe0a0; --grass2:#a9d48a; --water:#8ccbe6;
  --good:#6fae5a; --warn:#e2a23b; --bad:#d4614a; --dad:#e9f3ff; --dad-ink:#24476b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1915; --card:#27221d; --ink:#efe6da; --muted:#a8998a; --line:#3a332b;
  --accent:#d99a5e; --accent-soft:#3b2d20; --grass:#4f6b3e; --grass2:#46613a; --water:#3d7894;
  --dad:#22324a; --dad-ink:#cfe2ff; }}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
header h1{margin:0;font-size:22px}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.muted{color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;padding:0 20px 20px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:0 16px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
#hero{grid-column:1/-1}
#world{position:relative;width:100%;height:clamp(380px,70vh,820px);border-radius:12px;overflow:hidden;background:var(--grass)}
#world:fullscreen{height:100vh;border-radius:0}
#world canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene{width:100%;height:100%;display:block}
#tip{position:absolute;display:none;max-width:230px;background:rgba(30,24,18,.86);color:#fff;padding:5px 9px;border-radius:8px;font-size:13px;pointer-events:none}
#worldBtns{position:absolute;left:10px;right:10px;bottom:10px;display:none;gap:6px;flex-wrap:wrap}
#hud{position:absolute;left:10px;top:10px;max-width:min(360px,calc(100% - 20px));pointer-events:none}
#hud .bubble{margin:0;background:rgba(255,253,248,.82);color:#3b2f24;backdrop-filter:blur(6px);font-size:14px}
#hud .muted{color:#7a6a58}
#wx{position:absolute;right:10px;top:10px;background:rgba(255,253,248,.82);color:#3b2f24;border-radius:999px;padding:4px 11px;font-size:13px;pointer-events:none}
@media (max-width:600px){#wx{top:auto;bottom:96px}}
@media (max-width:900px){#chat{order:2;min-height:340px}#lower{order:3}}
#worldBtns button{background:rgba(255,253,248,.85);color:#3b2f24;border:none;padding:5px 10px;font-size:13px}
.bubble{margin-top:10px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;position:relative}
.bubble b{color:var(--accent)}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.vital label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
#chat{display:flex;flex-direction:column;height:100%;min-height:420px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;max-height:520px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.gino{background:var(--accent-soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.dad{background:var(--dad);color:var(--dad-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
form{display:flex;gap:8px;margin-top:10px}
input,button,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:8px 12px;background:var(--card);color:var(--ink)}
input{flex:1;min-width:0}
button{background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#lower{min-width:0}
.feed{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto}
.item{border-bottom:1px solid var(--line);padding:6px 2px}
.item time{font-size:12px;color:var(--muted);margin-right:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.art{border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--bg)}
.art img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff}
.art .txt{height:120px;overflow:hidden;font-size:13px;white-space:pre-wrap;color:var(--muted)}
dialog{border:none;border-radius:16px;max-width:min(720px,92vw);background:var(--card);color:var(--ink)}
dialog pre{white-space:pre-wrap;font:inherit}
.goal{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.goal pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted);margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>Gino's Home</h1>
  <span class="pill" id="status">waking up…</span>
  <span class="muted" id="meta"></span>
  <a href="/blog" target="_blank" rel="noopener" style="margin-left:auto">Gino's public website ↗</a>
</header>
<main>
  <section class="card" id="hero">
    <div id="world"><svg id="scene" viewBox="0 0 800 500" role="img" aria-label="Gino's habitat"></svg><div id="tip"></div>
      <div id="hud"><div class="bubble"><b id="feeling">…</b> <span id="reason" class="muted"></span><div id="thought" style="margin-top:4px"></div></div></div>
      <div id="wx"></div>
      <div id="worldBtns"><button class="ghost" id="followBtn">Follow Gino</button><button class="ghost" id="timeBtn">Sky: live</button><button class="ghost" id="wxBtn">Weather: live</button><button class="ghost" id="qBtn">Quality: high</button><button class="ghost" id="photoBtn">Photo</button><button class="ghost" id="fullBtn">Fullscreen</button></div></div>
    <div class="vitals" id="vitals"></div>
    <div class="row" style="margin-top:12px">
      <span class="muted">Leave a snack:</span>
      <select id="food"></select>
      <button class="ghost" id="giftBtn">Gift</button>
      <span class="muted" id="pantry" style="font-size:13px"></span>
    </div>
  </section>
  <section class="card" id="lower">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </section>
  <section class="card" id="chat">
    <div class="row" style="justify-content:space-between"><strong>Chat with Gino</strong><span class="muted" id="typing"></span></div>
    <div id="msgs"></div>
    <form id="chatForm"><input id="chatIn" placeholder="Say hi to Gino…" autocomplete="off" maxlength="4000"><button id="sendBtn">Send</button></form>
  </section>
</main>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><p class="muted" id="dlgNote"></p><form method="dialog"><button>Close</button></form></dialog>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }
</script>
<script>
const $ = s => document.querySelector(s);
const key = () => { try { return localStorage.getItem('ginoKey') || ''; } catch { return ''; } };
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'Content-Type': 'application/json', 'x-gino-key': key(), ...(opts.headers||{})}});
  if (r.status === 401) { const k = prompt("Gino's password?"); if (k) { try { localStorage.setItem('ginoKey', k); } catch {} return api(path, opts); } }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = ts => { const d = new Date(ts * 1000); const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); };
const NEEDS = [['fullness','Fullness'],['energy','Energy'],['social','Social'],['fun','Fun'],['comfort','Comfort'],['mood','Mood']];
const color = v => v > 60 ? 'var(--good)' : v > 30 ? 'var(--warn)' : 'var(--bad)';

function capy(x, y, asleep) {
  const cx = x * 50 + 25, cy = y * 50 + 30;
  const eye = asleep ? `<path d="M${cx+20} ${cy-14} q4 3 8 0" stroke="#3b2f24" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
                     : `<circle cx="${cx+24}" cy="${cy-14}" r="3.2" fill="#2b2118"/><circle cx="${cx+25}" cy="${cy-15}" r="1" fill="#fff"/>`;
  const z = asleep ? `<text x="${cx+30}" y="${cy-34}" font-size="18" fill="#5a6b8a" font-weight="700">z<tspan font-size="13" dy="-8">z</tspan></text>` : '';
  return `<g class="gino"><ellipse cx="${cx}" cy="${cy+16}" rx="34" ry="6" fill="rgba(0,0,0,.15)"/>
    <ellipse cx="${cx-4}" cy="${cy}" rx="32" ry="20" fill="#a8743f"/>
    <rect x="${cx+6}" y="${cy-26}" width="34" height="26" rx="12" fill="#b07d48"/>
    <rect x="${cx+30}" y="${cy-20}" width="14" height="14" rx="6" fill="#8a5d33"/>
    <ellipse cx="${cx+14}" cy="${cy-25}" rx="5" ry="4" fill="#8a5d33"/>
    ${eye}<rect x="${cx-24}" y="${cy+12}" width="8" height="10" rx="3" fill="#8a5d33"/><rect x="${cx+6}" y="${cy+12}" width="8" height="10" rx="3" fill="#8a5d33"/>${z}</g>`;
}

function drawScene(s) {
  const hr = new Date().getHours(); const night = hr < 7 || hr >= 21;
  let g = `<defs><pattern id="tuft" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M10 40 l3 -8 l3 8 M32 18 l2 -6 l2 6" stroke="var(--grass2)" stroke-width="2" fill="none"/></pattern></defs>
    <rect width="800" height="500" fill="var(--grass)"/><rect width="800" height="500" fill="url(#tuft)"/>`;
  for (const it of s.habitat) {
    const x = it.x * 50, y = it.y * 50; const n = it.name.toLowerCase();
    if (/pond|pool|water|lake|spring/.test(n)) g += `<ellipse cx="${x+25}" cy="${y+28}" rx="40" ry="22" fill="var(--water)" opacity=".85"/>`;
    g += `<text x="${x+25}" y="${y+36}" font-size="30" text-anchor="middle"><title>${esc(it.name)}${it.description ? ': ' + esc(it.description) : ''}</title>${esc(it.emoji)}</text>`;
  }
  g += capy(s.pos[0], s.pos[1], s.asleep);
  if (night) g += `<rect width="800" height="500" fill="#0b1a3a" opacity=".35" pointer-events="none"/>`;
  $('#scene').innerHTML = g;
}
let world = null;

let lastState = null;
async function refresh() {
  let s; try { s = await api('/api/state'); } catch (e) { $('#status').textContent = 'Gino is unreachable'; return; }
  lastState = s;
  $('#status').textContent = s.thinking ? 'thinking…' : s.asleep ? 'sleeping' : s.activity || 'chilling';
  const nw = s.next_wake_in > 0 ? ` · next turn in ${Math.round(s.next_wake_in/60)} min` : '';
  $('#meta').textContent = `${s.age_days} days old · brain: ${s.brain} · today's thinking: $${s.spent_today.toFixed(2)} of $${s.budget.toFixed(2)}${nw}`;
  $('#feeling').textContent = `Feeling ${s.emotion} (${s.emotion_intensity}/5)`;
  $('#reason').textContent = s.emotion_reason ? '· ' + s.emotion_reason : '';
  $('#thought').textContent = s.thought ? '💭 ' + s.thought : '';
  $('#vitals').innerHTML = NEEDS.map(([k, l]) => `<div class="vital"><label>${l}<span>${s.vitals[k]}</span></label><div class="bar"><i style="width:${s.vitals[k]}%;background:${color(s.vitals[k])}"></i></div></div>`).join('');
  $('#pantry').textContent = 'Pantry: ' + (Object.entries(s.pantry).map(([f, n]) => `${s.foods[f] || ''}${n}`).join(' ') || 'empty');
  if (!$('#food').options.length) $('#food').innerHTML = Object.entries(s.foods).map(([f, e]) => `<option value="${esc(f)}">${e} ${esc(f)}</option>`).join('');
  const WX = {clear:'☀️', cloudy:'☁️', rain:'🌧️', snow:'❄️', fog:'🌫️'};
  $('#wx').textContent = s.weather ? `${WX[s.weather.kind] || ''} ${s.weather.text}` : '';
  if (world) world.update(s); else drawScene(s);
  if (tab === 'goals' || tab === 'about') renderTab();
}

let chatIds = '';
async function loadChat() {
  const rows = await api('/api/feed?kind=chat&limit=80');
  const ids = rows.map(r => r.id).join(',');
  if (ids === chatIds) return; chatIds = ids;
  $('#msgs').innerHTML = rows.map(r => `<div class="msg ${r.sender === 'dad' ? 'dad' : 'gino'}">${esc(r.text)}<small>${when(r.ts)}</small></div>`).join('') || '<p class="muted">Gino hasn\'t said anything yet. Say hi!</p>';
  $('#msgs').scrollTop = 1e9;
}
$('#chatForm').onsubmit = async e => {
  e.preventDefault(); const t = $('#chatIn').value.trim(); if (!t) return;
  $('#chatIn').value = ''; $('#sendBtn').disabled = true; $('#typing').textContent = 'Gino is typing…';
  $('#msgs').insertAdjacentHTML('beforeend', `<div class="msg dad">${esc(t)}</div>`); $('#msgs').scrollTop = 1e9;
  try { await api('/api/chat', {method: 'POST', body: JSON.stringify({text: t})}); } catch (err) { alert('Message failed: ' + err.message); }
  $('#sendBtn').disabled = false; $('#typing').textContent = ''; chatIds = ''; loadChat(); refresh();
};
$('#giftBtn').onclick = async () => { await api('/api/gift', {method: 'POST', body: JSON.stringify({food: $('#food').value})}); refresh(); };

const TABS = [['events','Activity'],['journal','Diary'],['creations','Creations'],['goals','Goals'],['memories','Memories'],['about','About Gino']];
let tab = 'events';
$('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('');
$('#tabs').onclick = e => { const k = e.target.dataset.k; if (k) { tab = k; renderTab(); } };

async function renderTab() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === tab));
  const P = $('#panel');
  if (tab === 'goals') {
    const g = lastState?.goals || [];
    P.innerHTML = g.map(x => `<div class="goal"><strong>${x.status === 'done' ? '✅' : x.status === 'dropped' ? '🍂' : '🎯'} ${esc(x.title)}</strong> <span class="muted">${esc(x.why)}</span>${x.steps ? `<div class="muted" style="font-size:13px">Plan: ${esc(x.steps)}</div>` : ''}${x.progress ? `<pre>${esc(x.progress)}</pre>` : ''}</div>`).join('') || '<p class="muted">No goals yet. Gino will choose his own.</p>';
    return;
  }
  if (tab === 'about') {
    const me = lastState?.self || {};
    P.innerHTML = Object.keys(me).length ? Object.entries(me).map(([k, v]) => `<p><strong>${esc(k.replace('_', ' '))}:</strong> ${esc(v)}</p>`).join('') : '<p class="muted">Gino hasn\'t described himself yet.</p>';
    return;
  }
  const rows = await api(`/api/feed?kind=${tab}&limit=100`);
  if (tab === 'creations') {
    P.innerHTML = `<div class="gallery">${rows.map(r => `<div class="art" data-f="${esc(r.filename)}" data-t="${esc(r.title)}" data-n="${esc(r.note)}" data-k="${esc(r.kind)}">${r.kind === 'svg' ? `<img alt="${esc(r.title)}" src="/creations/${esc(r.filename)}?key=${encodeURIComponent(key())}">` : `<div class="txt" data-load="${esc(r.filename)}"></div>`}<strong>${esc(r.title)}</strong><div class="muted" style="font-size:12px">${esc(r.kind)} · ${when(r.ts)}</div></div>`).join('')}</div>` || '<p class="muted">Nothing yet.</p>';
    P.querySelectorAll('[data-load]').forEach(async el => { const r = await fetch(`/creations/${el.dataset.load}`, {headers: {'x-gino-key': key()}}); el.textContent = await r.text(); });
    P.querySelectorAll('.art').forEach(el => el.onclick = async () => {
      $('#dlgTitle').textContent = el.dataset.t; $('#dlgNote').textContent = el.dataset.n;
      if (el.dataset.k === 'svg') $('#dlgBody').innerHTML = `<img style="width:100%;background:#fff;border-radius:10px" src="/creations/${el.dataset.f}?key=${encodeURIComponent(key())}">`;
      else { const r = await fetch(`/creations/${el.dataset.f}`, {headers: {'x-gino-key': key()}}); $('#dlgBody').innerHTML = `<pre>${esc(await r.text())}</pre>`; }
      $('#dlg').showModal(); });
    if (!rows.length) P.innerHTML = '<p class="muted">Gino hasn\'t made anything yet.</p>';
    return;
  }
  const line = r => tab === 'journal' ? `<div class="item"><time>${when(r.ts)}</time>${r.emotion ? `<span class="pill">${esc(r.emotion)}</span>` : ''}<div style="white-space:pre-wrap">${esc(r.text)}</div></div>`
    : tab === 'memories' ? `<div class="item"><time>${when(r.ts)}</time>${'★'.repeat(r.importance)} ${esc(r.text)}</div>`
    : `<div class="item"><time>${when(r.ts)}</time>${esc(r.text)}</div>`;
  P.innerHTML = `<div class="feed">${rows.map(line).join('') || '<p class="muted">Nothing here yet.</p>'}</div>`;
}

refresh(); loadChat(); renderTab();
// 3D world. If three.js can't load (offline, no WebGL) the flat map above stays.
(async () => {
  try {
    const m = await import('/static/world.js');
    while (!lastState) await new Promise(r => setTimeout(r, 100));
    let f = false;
    const w = m.createWorld($('#world'), $('#tip'), {
      season: new URLSearchParams(location.search).get('season') || lastState.weather?.season, key: key(),
      onPet: () => api('/api/pet', {method: 'POST'}).then(refresh).catch(() => {}),
      autoQuality: !new URLSearchParams(location.search).has('hq'),
      onQuality: q => { $('#qBtn').textContent = 'Quality: ' + q; },
      onFollow: v => { f = v; $('#followBtn').textContent = f ? 'Free camera' : 'Follow Gino'; },
    });
    $('#scene').remove(); $('#worldBtns').style.display = 'flex'; world = w; window.ginoWorld = w; w.update(lastState);
    $('#followBtn').onclick = () => { f = !f; w.setFollow(f); $('#followBtn').textContent = f ? 'Free camera' : 'Follow Gino'; };
    const cycle = (btn, label, opts, fn) => { let i = 0; btn.onclick = () => { i = (i + 1) % opts.length; fn(opts[i][0]); btn.textContent = `${label}: ${opts[i][1]}`; }; };
    cycle($('#timeBtn'), 'Sky', [['auto', 'live'], ['day', 'day'], ['sunset', 'sunset'], ['night', 'night']], v => w.setTime(v));
    cycle($('#wxBtn'), 'Weather', [[null, 'live'], ['clear', 'clear'], ['cloudy', 'cloudy'], ['rain', 'rain'], ['snow', 'snow'], ['fog', 'fog']], v => w.setWeather(v));
    $('#qBtn').textContent = 'Quality: ' + w.quality; $('#qBtn').onclick = () => w.setQuality(w.quality === 'high' ? 'low' : 'high');
    $('#photoBtn').onclick = async () => { const blob = await w.photo(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gino-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
    $('#fullBtn').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : $('#world').requestFullscreen?.(); };
  } catch (e) { console.warn('3D world unavailable, showing the flat map.', e); }
})();
</script>
</body>
</html>
